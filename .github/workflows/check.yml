name: automated check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "テスト通知を1件送信する"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: send test notification
        if: ${{ inputs.test_notify }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          curl -s -X POST https://api.line.me/v2/bot/message/broadcast \
            -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"messages":[{"type":"text","text":"✅ テスト通知: 連携は正常に動作しています"}]}'

      - name: run check
        if: ${{ !inputs.test_notify }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          MONITOR_URLS_JSON: ${{ secrets.MONITOR_URLS_JSON }}
          KEYWORDS_JSON: ${{ secrets.KEYWORDS_JSON }}
          SINGLE_PAGE_TARGETS_JSON: ${{ secrets.SINGLE_PAGE_TARGETS_JSON }}
        run: python monitor.py

      - name: commit updated state
        if: ${{ !inputs.test_notify }}
        run: |
          git config user.name "auto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "update state"
          git pull --rebase --autostash origin main
          git push
